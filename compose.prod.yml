# Production on the Raspberry Pi. Use both files, so the development override is skipped:
#   docker compose -f compose.yml -f compose.prod.yml up --build -d
# Only the proxy is published: it serves the website at / and the API at /api.
services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    command: sh -c "alembic -c backend/users/alembic.ini upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000 --root-path /api --proxy-headers --forwarded-allow-ips='*'"
    ports: !reset []
    environment:
      CORS_ORIGINS: https://greenestbikeroute.ta-a-mi.earth

  frontend:
    build: ./frontend
    image: greenestbikeroute-frontend:latest
    container_name: bike-frontend
    restart: unless-stopped
    environment:
      # Same address as the page, so the browser needs no separate API host.
      NEXT_PUBLIC_GREENEST_API_URL: /api

  proxy:
    image: nginx:stable-alpine
    container_name: bike-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
