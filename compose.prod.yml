# Production on the Raspberry Pi. Use both files, so the development override is skipped:
#   docker compose -f compose.yml -f compose.prod.yml up --build -d
# Only the proxy is published: it serves the website at / and the API at /api.
x-limited-logs: &limited-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    logging: *limited-logs

  backend:
    restart: unless-stopped
    # No access log here: the proxy keeps the only one, for 7 days.
    command: sh -c "alembic -c backend/users/alembic.ini upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000 --root-path /api --proxy-headers --forwarded-allow-ips='*' --no-access-log"
    ports: !reset []
    logging: *limited-logs
    environment:
      CORS_ORIGINS: https://greenestbikeroute.ta-a-mi.earth

  frontend:
    build: ./frontend
    image: greenestbikeroute-frontend:latest
    container_name: bike-frontend
    restart: unless-stopped
    logging: *limited-logs
    environment:
      # Same address as the page, so the browser needs no separate API host.
      NEXT_PUBLIC_GREENEST_API_URL: /api

  proxy:
    image: nginx:stable-alpine
    container_name: bike-proxy
    restart: unless-stopped
    logging: *limited-logs
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - access-logs:/var/log/bike-access
    depends_on:
      - frontend
      - backend
      - log-cleaner

  # A daily file's first entry is a day older than its last write: 8580 min + that day + the hourly check = 7 days.
  log-cleaner:
    image: nginx:stable-alpine
    container_name: bike-log-cleaner
    restart: unless-stopped
    logging: *limited-logs
    entrypoint: ["sh", "-c", "chown 101:101 /logs; while true; do find /logs -name 'access-*.log' -mmin +8580 -delete; sleep 3600; done"]
    volumes:
      - access-logs:/logs

volumes:
  access-logs:
