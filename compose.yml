# Backend + PostgreSQL for the user accounts (backend/users). The USERS_* values come from .env:
# copy .env.users.example to .env first and set your own password and secret.
services:
  postgres:
    image: postgres:16
    container_name: bike-postgres
    environment:
      POSTGRES_USER: ${USERS_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${USERS_DATABASE_PASSWORD}
      POSTGRES_DB: ${USERS_DATABASE_NAME}
    ports:
      # Your computer's port (from .env, e.g. 5434) -> PostgreSQL's port inside the container (always 5432).
      - "${USERS_DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ = a literal $, so the container fills these in, not Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bike-backend
    # Create or update the users tables, then serve.
    command: sh -c "alembic -c backend/users/alembic.ini upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    env_file:
      - .env
    environment:
      # Inside Docker, the database is the "postgres" service on its inside port.
      # These two override the localhost/5434 values from .env, which are for running on your computer.
      USERS_DATABASE_HOSTNAME: postgres
      USERS_DATABASE_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
