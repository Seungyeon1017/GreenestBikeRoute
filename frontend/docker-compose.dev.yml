services:
  postgres:
    image: postgres:16-alpine
    container_name: klimadashboard_dev_postgres
    restart: unless-stopped
    command: postgres -c ssl=off
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d klimadashboard']
      interval: 10s
      timeout: 5s
      retries: 5
    admin:
      image: klima-admin
      restart: unless-stopped
      env_file: '.env'
      environment:
        PORT: 3001
      ports:
        - '3001:3001'
      networks:
        - default
volumes:
  postgres_data:
