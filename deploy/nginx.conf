# Keeps https from Cloudflare Tunnel; falls back to the scheme of a direct local request.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# One access log per day, so compose.prod.yml's log-cleaner can delete old days.
map $time_iso8601 $log_date {
    default                  undated;
    "~^(\d{4}-\d{2}-\d{2})"  $1;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    # An existing root: nginx skips access logs with a variable path without one.
    root /usr/share/nginx/html;
    access_log /var/log/bike-access/access-$log_date.log combined;
    # Lower levels would keep client addresses and URLs outside the 7-day access logs.
    error_log /dev/stderr crit;

    # Docker's DNS: containers keep working after one of them restarts with a new IP.
    resolver 127.0.0.11 valid=10s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 180s;

    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
