# Alembic settings for the users database. Run Alembic from the repo root with:
#   alembic -c backend/users/alembic.ini <command>

[alembic]
# Where env.py and versions/ are (%(here)s = this file's folder).
script_location = %(here)s/migrations
# Lets env.py import "backend.users..." (the repo root is two folders up).
prepend_sys_path = %(here)s/../..
path_separator = os
# Migration file names start with the date, so they sort in order.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# No sqlalchemy.url here: env.py reads USERS_DATABASE_URL (backend/users/config.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S