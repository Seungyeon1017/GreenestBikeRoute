[project]
name = "greenestbikeroute"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "networkx>=3.0",
    "osmnx>=2.0",
    "requests>=2.31",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Only for recomputing the roughness estimates (estimation/estimate_roughness.py); the API just reads its output.
estimation = [
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]
