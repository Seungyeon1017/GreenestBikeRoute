[project]
name = "greenestbikeroute"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "networkx>=3.0",
    "osmnx>=2.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "requests>=2.31",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Only for recomputing the roughness estimates (estimation/estimate_roughness.py); the API just reads its output.
estimation = [
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]
